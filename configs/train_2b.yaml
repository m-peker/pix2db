model: Qwen/Qwen3-VL-2B-Instruct
train_dir: data/train
output_dir: /workspace/ckpt/qwen3vl2b-lora-v1
seed: 42
max_pixels: 1310720     # 1280 * 32 * 32 -> at most ~1280 visual tokens
max_len: 4096

lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
# language model only; vision tower frozen
target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)'

batch_size: 8
grad_accum: 2           # effective batch 16
lr: 1.0e-4
warmup_ratio: 0.03
epochs: 1
save_steps: 300
gradient_checkpointing: true
