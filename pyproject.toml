[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pix2db"
version = "0.1.0"
description = "Image of a table, form, invoice or chart -> working SQLite database (small VLM + verify/repair)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Musa Peker" }]
dependencies = [
  "transformers>=4.57",
  "torch>=2.4",
  "accelerate",
  "pillow",
  "pandas",
  "numpy",
]

[project.optional-dependencies]
train = ["peft>=0.17", "datasets", "pyyaml", "playwright", "matplotlib", "scipy", "beautifulsoup4", "lxml"]
demo = ["gradio>=5"]

[project.urls]
Homepage = "https://github.com/m-peker/pix2db"

[tool.setuptools.packages.find]
where = ["src"]
